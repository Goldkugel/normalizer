[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "normalizer"
version = "1.0.4"
requires-python = ">=3.9"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.0.6",
    "en_core_sci_sm @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_sm-0.5.4.tar.gz",
    "nltk>=3.6",
    "pydantic>=2",
    "pyyaml",
    "scispacy>=0.5.4",
    "spacy>=3.7"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["normalizer"]

[tool.setuptools.package-dir]
"normalizer" = "src"
