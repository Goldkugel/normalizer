[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "normalizer"
version = "1.0.3"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.0.6"
]

[tool.setuptools]
packages = ["normalizer"]

[tool.setuptools.package-dir]
"normalizer" = "src"