# Read by the logger package, which Normalizer uses for its progress messages.
# Normalizer configures the logger from this section unless another module
# has configured it already.
logger:
  folder: "./data/logs/"
  file_name: "output.log"
  header_char: "-"
  header_length: 60
  log_runtime: True
  format: "%Y-%m-%d %H:%M:%S"
# Read by Normalizer (validated by NormalizerConfig); see config/README.md.
normalizer:
  model_name: "en_core_sci_sm"
  lower_case: True
  lemmatizing: True
  stemming: False
  stop_word_removal: True
